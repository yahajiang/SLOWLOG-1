<style>
:root{
  --yh-bg:#fefdfa;--yh-text:#1c1c1e;--yh-muted:#6e6e73;--yh-border:#e5e5e7;
  --yh-accent:#4a6fb5;--yh-accent:oklch(0.55 0.15 250);--dash-card:#ffffff;
  --shadow-card:0 1px 3px rgba(0,0,0,.04);--shadow-float:0 8px 30px -8px rgba(0,0,0,.15);--shadow-pop:0 20px 60px rgba(0,0,0,.12);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);--ease-out:cubic-bezier(0.16,1,0.3,1);
}
.dark{--yh-bg:#14110d;--yh-text:#e8e4dc;--yh-muted:#8e8478;--yh-border:#2c2a26;--yh-accent:#8ea6e8;--yh-accent:oklch(0.78 0.13 250);--dash-card:#1c1915}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--yh-bg);color:var(--yh-text);font-family:"Plus Jakarta Sans","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;transition:background .3s,color .3s}
.serif{font-family:"Cormorant Garamond","Noto Serif SC","Songti SC",Georgia,serif}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:40;height:62px;background:color-mix(in srgb,var(--yh-bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--yh-border)}
.h-in{max-width:1080px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.h-in nav{display:flex;gap:22px;font-size:13px}
.h-in nav a{color:var(--yh-muted)}.h-in nav a.on{color:var(--yh-text);font-weight:600}
.logo-s{width:26px;height:26px;border-radius:50%;background:var(--yh-text);color:var(--yh-bg);display:inline-flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:12px;margin-right:8px;vertical-align:-6px}
.wrap{max-width:1080px;margin:0 auto;padding:36px 24px 90px}
h1{font-family:"Cormorant Garamond","Noto Serif SC",serif;font-size:34px;font-weight:600;letter-spacing:-0.02em}
.sub{color:var(--yh-muted);font-size:12.5px;margin:4px 0 22px}
.srch{position:relative;margin-bottom:16px}
.srch input{width:100%;padding:12px 14px 12px 40px;font-size:14px;border:1px solid var(--yh-border);background:var(--dash-card);color:var(--yh-text);border-radius:0;outline:none;font-family:inherit}
.srch input:focus{border-color:var(--yh-accent)}
.srch input:focus-visible{outline:2px solid var(--yh-accent);outline-offset:2px}
.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--yh-muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{font-size:12px;padding:6px 14px;border:1px solid var(--yh-border);background:var(--dash-card);color:var(--yh-muted);cursor:pointer;font-family:inherit;transition:all .15s}
.tab:hover{color:var(--yh-text)}
.tab.on{background:var(--yh-text);color:var(--yh-bg);border-color:var(--yh-text);font-weight:600}
.cnt{font-size:11.5px;color:var(--yh-muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.card{border:1px solid var(--yh-border);background:var(--dash-card);cursor:pointer;transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease-out),border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-float);border-color:var(--yh-muted)}
.pv{height:150px;border-bottom:1px solid var(--yh-border);position:relative;overflow:hidden;background:var(--yh-bg);display:flex;align-items:center;justify-content:center;padding:16px}
.pv *{font-family:inherit}
/* 覆写还原：.pv *{inherit} 会把预览内 .mono/.serif 打成 sans，而模态 .m-pv 无此规则——补后置高特异规则，两处渲染一致 */
.pv .mono,.m-pv .mono{font-family:"JetBrains Mono",ui-monospace,monospace}.pv .serif,.m-pv .serif{font-family:"Cormorant Garamond","Noto Serif SC","Songti SC",Georgia,serif}
.ci{padding:14px 16px 16px}
.tag{display:inline-block;font-size:10px;padding:1px 8px;border:1px solid var(--yh-border);color:var(--yh-muted);margin-bottom:8px}
.ci h3{font-size:14px;font-weight:600;margin-bottom:5px}
.ci p{font-size:12px;color:var(--yh-muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;transition:opacity .2s var(--ease-out)}
.modal-mask.open{display:flex;animation:g-maskIn .2s var(--ease-out)}
.modal-mask.open .modal{animation:g-scaleIn .2s var(--ease-out)}
.modal-mask.closing{opacity:0}
@keyframes g-maskIn{from{opacity:0}to{opacity:1}}
@keyframes g-scaleIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.modal{background:var(--yh-bg);border:1px solid var(--yh-border);max-width:720px;width:100%;padding:28px;position:relative}
.modal .x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;color:var(--yh-muted);cursor:pointer}
.modal .x:hover{color:var(--yh-text)}

@keyframes motionBreath{0%,100%{opacity:.92}50%{opacity:1}}
@keyframes pv-shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
@keyframes pv-toast{0%{opacity:0;transform:translateX(16px)}12%,80%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(16px)}}
@keyframes pv-grow{0%{transform:scaleY(.12)}55%,100%{transform:scaleY(1)}}
@keyframes pv-scale{0%{transform:scale(.94);opacity:.55}16%,84%{transform:scale(1);opacity:1}100%{transform:scale(.94);opacity:.55}}
.breath{animation:motionBreath 3s ease-in-out infinite}
.pv .shim,.m-pv .shim{animation:pv-shimmer 1.5s linear infinite}
.pv .shim.d2,.m-pv .shim.d2{animation-delay:.2s}
.pv .shim.d3,.m-pv .shim.d3{animation-delay:.4s}
.pv .anim-toast,.m-pv .anim-toast{animation:pv-toast 3.6s var(--ease-out) infinite}
.pv .anim-toast2,.m-pv .anim-toast2{animation:pv-toast 3.6s var(--ease-out) 1.8s infinite}
.pv .tl-fill,.m-pv .tl-fill{transform-origin:top;animation:pv-grow 3.6s ease-in-out infinite}
.pv .dlg-anim,.m-pv .dlg-anim{animation:pv-scale 3.8s var(--ease-out) infinite}
.pv-toc a{display:flex;gap:8px;padding:4px 0 4px 10px;color:var(--yh-muted);border-left:2px solid transparent;transition:all .3s;font-size:11.5px}
.pv-toc a.on{color:var(--yh-accent);border-left-color:var(--yh-accent);font-weight:600}
.pv-toc a .dot{width:4px;height:4px;border-radius:50%;background:var(--yh-border)}
.pv-toc a.on .dot{background:var(--yh-accent)}
.t3{flex:1;text-align:center;font-size:10px;padding:6px 0;border:1px solid var(--yh-border);color:var(--yh-muted);background:transparent;cursor:pointer;font-family:inherit;transition:all .2s}
.t3.sel{background:var(--yh-text);color:var(--yh-bg);border-color:var(--yh-text);font-weight:600}
.lg{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;padding:5px 12px;border:1px solid var(--yh-border);background:var(--dash-card);font-weight:500;color:var(--yh-text);cursor:pointer}
.lg:hover{border-color:var(--yh-muted)}
.statc{transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease-out)}
.statc:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
.mini-card{cursor:pointer;transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease-out),border-color .2s}
.mini-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-float);border-color:var(--yh-muted)}
.mini-card:hover .mc-t{color:var(--yh-accent)}
.mc-t{transition:color .2s}
.pv .b-primary,.m-pv .b-primary{background:var(--yh-text);color:var(--yh-bg);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:8px 18px;cursor:pointer;border:none;transition:background .2s}
.pv .b-primary:hover,.m-pv .b-primary:hover{background:var(--yh-accent)}
.pv .b-ghost,.m-pv .b-ghost{border:1px solid var(--yh-border);color:var(--yh-muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:8px 18px;cursor:pointer;background:transparent;transition:all .2s}
.pv .b-ghost:hover,.m-pv .b-ghost:hover{color:var(--yh-text);border-color:var(--yh-muted)}
.pv .pv-srch,.m-pv .pv-srch{position:relative;width:100%;max-width:210px}
.pv .pv-srch .ic,.m-pv .pv-srch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--yh-muted);font-size:11px}

.pv .rp-btn,.m-pv .rp-btn{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;padding:3px 8px;border:1px solid var(--yh-border);background:var(--dash-card);color:var(--yh-muted);cursor:pointer;position:absolute;top:8px;right:8px;z-index:5}
.pv .rp-btn:hover,.m-pv .rp-btn:hover{color:var(--yh-text);border-color:var(--yh-muted)}
.pv .arow,.m-pv .arow{transition:background .2s}
.pv .arow:hover,.m-pv .arow:hover{background:color-mix(in srgb,var(--yh-bg) 55%,transparent)}
.pv .arow .ar,.m-pv .arow .ar{opacity:0;transform:translateX(-4px);transition:all .2s;color:var(--yh-accent)}
.pv .arow:hover .ar,.m-pv .arow:hover .ar{opacity:1;transform:translateX(0)}
.seed-in{font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 6px;border:1px solid #3A332E;background:transparent;color:#3A332E;outline:none;width:86px}
.seed-in:focus{border-color:#C9A98A}
.seed-in:focus-visible{outline:2px solid #C9A98A;outline-offset:2px}
.pv .dlg-btn,.m-pv .dlg-btn{font-size:10px;padding:4px 10px;cursor:pointer;font-family:inherit;border-radius:0}

.pv .pv-input,.m-pv .pv-input{width:100%;padding:9px 12px 9px 30px;font-size:12px;border:1px solid var(--yh-border);background:var(--dash-card);color:var(--yh-text);outline:none;font-family:inherit}
.pv .pv-input:focus,.m-pv .pv-input:focus{border-color:var(--yh-accent)}
.pv .pv-input:focus-visible,.m-pv .pv-input:focus-visible{outline:2px solid var(--yh-accent);outline-offset:2px}
@keyframes pv-ink{0%{opacity:0;transform:translateY(5px)}18%,72%{opacity:1;transform:none}88%,100%{opacity:0}}
.pv-ink span{display:inline-block;opacity:0;animation:pv-ink 2.8s var(--ease-out) infinite}
.pv .tglw,.m-pv .tglw{width:32px;height:18px;background:var(--yh-border);position:relative;display:inline-block;cursor:pointer;transition:background .2s;vertical-align:middle}
.pv .tglw.on,.m-pv .tglw.on{background:var(--yh-accent)}
.pv .tglw .kn,.m-pv .tglw .kn{position:absolute;top:2px;left:1px;width:14px;height:14px;background:var(--dash-card);box-shadow:inset 0 0 0 1px var(--yh-border),0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease-spring)}
.pv .tglw.on .kn,.m-pv .tglw.on .kn{transform:translateX(15px)}
.pv .sp-row:hover,.m-pv .sp-row:hover{background:color-mix(in srgb,var(--yh-bg) 55%,transparent)}
.sp-row{cursor:pointer;transition:background .15s var(--ease-out)}
.sp-row.sel{background:color-mix(in srgb,var(--yh-bg) 80%,var(--yh-accent))}
.sp-row.sel>span:first-child{color:var(--yh-accent);font-weight:600}
.pv .b-primary,.m-pv .b-primary,.pv .b-ghost,.m-pv .b-ghost{transition:color .2s var(--ease-out),background-color .2s var(--ease-out),transform .15s var(--ease-out)}
.pv .b-primary:active,.m-pv .b-primary:active,.pv .b-ghost:active,.m-pv .b-ghost:active{transform:scale(0.97)}
.mc-art{display:inline-block;transition:transform .3s var(--ease-out)}
.card:hover .mc-art{transform:scale(1.06)}
@keyframes g-ffIn{from{opacity:0}to{opacity:1}}
@keyframes g-sbIn{from{transform:scale(0.92)}to{transform:scale(1)}}
/* 封面内部轻微入场（与真代码 SVG 描边/呼吸同语言） */
@keyframes g-cvFade{from{opacity:0;transform:translateY(4px)}}
@keyframes g-cvLine{from{transform:scaleX(0)}}
@keyframes g-cvRot{from{opacity:0;transform:rotate(-8deg)}}
@keyframes g-cvPop{from{transform:scale(0)}}
.pv .cv-fade,.m-pv .cv-fade{animation:g-cvFade .5s var(--ease-out) .1s backwards}
.pv .cv-line,.m-pv .cv-line{transform-origin:left;animation:g-cvLine .6s var(--ease-out) .2s backwards}
.pv .cv-rot,.m-pv .cv-rot{animation:g-cvRot .5s var(--ease-out) .3s backwards}
.pv .cv-pop,.m-pv .cv-pop{animation:g-cvPop .4s var(--ease-spring) .5s backwards,g-pulse 3s ease-in-out 1s infinite}
@keyframes g-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes g-cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* —— 页面级细节动效 —— */
html{scroll-behavior:smooth}
::selection{background:color-mix(in srgb,var(--yh-accent) 22%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--yh-border);border:3px solid var(--yh-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--yh-muted)}
::-webkit-scrollbar-track{background:transparent}
.wrap{animation:g-ffIn .4s var(--ease-out)}
.card{animation:g-cardIn .35s var(--ease-out) backwards}
.card:hover .mc-t{color:var(--yh-accent)}
.mc-t{transition:color .2s var(--ease-out)}
.pv .tglw:active .kn,.m-pv .tglw:active .kn{scale:.9}
.m-body>*{animation:g-ffIn .3s var(--ease-out) backwards}
.m-body>*:nth-child(2){animation-delay:60ms}
.m-body>*:nth-child(3){animation-delay:120ms}
.m-body>*:nth-child(4){animation-delay:180ms}
.m-body>*:nth-child(5){animation-delay:240ms}
/* 主题切换双图标（照搬主项目 ThemeToggle）：亮色月 / 暗色日，随 body.dark 显隐 */
.ti-sun{display:none}
body.dark .ti-moon{display:none}
body.dark .ti-sun{display:inline}
.pv .tagchip,.m-pv .tagchip{font-size:11px;padding:5px 12px;border:1px solid var(--yh-border);color:var(--yh-muted);transition:all .2s;cursor:pointer}
.pv .tagchip:hover,.m-pv .tagchip:hover{background:var(--yh-accent);color:var(--yh-bg);border-color:var(--yh-accent)}



.m-pv{height:210px;border:1px solid var(--yh-border);background:var(--yh-bg);display:flex;align-items:center;justify-content:center;padding:20px;margin:16px 0}
.m-meta{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.prompt-box{position:relative;margin-top:10px}
.prompt-box pre{font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.75;background:var(--dash-card);border:1px solid var(--yh-border);padding:18px;white-space:pre-wrap;overflow:auto;max-height:340px}
.copy{position:absolute;top:10px;right:10px;font-size:11px;padding:5px 12px;border:1px solid var(--yh-border);background:var(--yh-bg);color:var(--yh-muted);cursor:pointer;font-family:inherit}
.copy:hover{color:var(--yh-text);border-color:var(--yh-muted)}.copy-main{font-size:12px;font-weight:600;padding:8px 18px;background:var(--yh-accent);color:var(--yh-bg);border:none;cursor:pointer;font-family:inherit;letter-spacing:.05em;transition:opacity .2s;flex-shrink:0}.copy-main:hover{opacity:.85}.copy-main.ok{background:var(--yh-text)}
.copy.ok{color:var(--yh-accent);border-color:var(--yh-accent)}
.s-logo{width:26px;height:26px;border-radius:50%;background:var(--yh-text);color:var(--yh-bg);display:inline-flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:12px;margin-right:8px;vertical-align:middle;flex-shrink:0}
.empty{text-align:center;padding:60px 0;color:var(--yh-muted)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

const CATS = ["全部","布局导航","数据展示","反馈","输入","动效"];
let cur = "全部";
document.getElementById("tabs").innerHTML = CATS.map(c=>{const n=c==="全部"?C.length:C.filter(x=>x.cat===c).length;return `<button class="tab${c===cur?" on":""}" onclick="setCat('${c}')" title="${c} · ${n} 个">${c}${`<span class="mono" style="font-size:8px;opacity:.55;margin-left:4px">${n}</span>`}`}).join("");

function setCat(c){cur=c;document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("on",CATS[i]===c));render()}
function render(){
  const q=(document.getElementById("q").value||"").toLowerCase();
  const list=C.filter(c=>(cur==="全部"||c.cat===cur)&&(!q||(c.name+c.desc+c.cat).toLowerCase().includes(q)));

  document.getElementById("empty").style.display=list.length?"none":"block";
}

function pvGuard(e){
  if(e.target.closest('button,input,a,.t3,.lg,.seed-in,.arow')) e.stopPropagation();
}
function copyP(btn, srcId){
  const t = document.getElementById(srcId || "pp").innerText;
  const done=function(){btn.textContent="✓ 已复制";btn.classList.add("ok");setTimeout(function(){btn.textContent="复制提示词";btn.classList.remove("ok")},1600)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(function(){fb()})}else{fb()}
  function fb(){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});

/* 动态预览驱动（reduced-motion 用户跳过轮询动画） */
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!REDUCED) setInterval(function(){
  var n=Math.floor(Date.now()/1200);
  document.querySelectorAll('.pv-toc').forEach(function(t){
    if(t.dataset.pause && Date.now() < +t.dataset.pause) return;
    var items=t.querySelectorAll('a');
    items.forEach(function(a,i){a.classList.toggle('on',i===n%items.length)});
  });
},600);
function go(id){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'})}
function btnClick(btn,txt){
  if(btn.dataset.busy) return; btn.dataset.busy="1";
  var old=btn.innerHTML;
  btn.innerHTML=txt; btn.style.opacity=".5";
  setTimeout(function(){ btn.innerHTML=old; btn.style.opacity=""; delete btn.dataset.busy; },900);
}
function ffInput(inp){
  var line=inp.parentNode.querySelector(".ff-line"); if(!line) return;
  if(!inp.value.trim()){ line.textContent="站点名称不能为空"; line.style.color="#ef4444"; }
  else { line.textContent="显示在浏览器标签页"; line.style.color="var(--yh-muted)"; }
  line.style.animation="none"; void line.offsetWidth; line.style.animation="g-ffIn .2s ease-out";
}
var SB=[
  ["#ecfdf5","#a7f3d0","#065f46","已发布"],
  ["#fffbeb","#fde68a","#92400e","草稿"],
  ["#f0f9ff","#bae6fd","#0369a1","定时"]
];
function sbClick(el){
  var i=((+(el.dataset.i||0))+1)%3; el.dataset.i=i;
  el.style.background=SB[i][0]; el.style.borderColor=SB[i][1]; el.style.color=SB[i][2]; el.textContent=SB[i][3];
  el.style.animation="none"; void el.offsetWidth; el.style.animation="g-sbIn .25s ease-out";
}
function esClick(btn){
  if(btn.dataset.busy) return; btn.dataset.busy="1";
  var old=btn.textContent;
  btn.textContent="已清除 ✓"; btn.style.borderColor="var(--yh-accent)"; btn.style.color="var(--yh-accent)";
  setTimeout(function(){ btn.textContent=old; btn.style.borderColor=""; btn.style.color=""; delete btn.dataset.busy; },1200);
}
function spClick(row){
  document.querySelectorAll(".sp-row").forEach(function(r){ r.classList.remove("sel"); });
  row.classList.add("sel");
}
function tglclick(btn){btn.classList.toggle('on')}
function t3click(){/* 兜底占位：选中态由 document click 委托处理，防 onclick 报 ReferenceError */}
function lgclick(){/* 兜底占位：文案切换由 document click 委托处理 */}
function tocClick(el){
  var t=el.closest('.pv-toc'); if(!t) return;
  t.dataset.pause = String(Date.now()+4000);
  t.querySelectorAll('a').forEach(function(a){a.classList.remove('on')});
  el.classList.add('on');
}
function tlReplay(btn){
  var box=btn.closest('.pv,.m-pv'); if(!box) return;
  var f=box.querySelector('span[style*="pv-grow"]'); if(!f) return;
  f.style.animation='none'; void f.offsetWidth; f.style.animation='';
}
function toastReplay(btn){
  var box=btn.closest('.pv,.m-pv'); if(!box) return;
  box.querySelectorAll('.anim-toast,.anim-toast2').forEach(function(el){
    el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  });
}
function dlgBtn(btn,del){
  var box=btn.closest('.pv,.m-pv'); if(!box) return;
  var panel=box.querySelector('.dlg-anim'); if(!panel) return;
  if(del){ panel.style.borderColor='#dc2626'; setTimeout(function(){panel.style.borderColor=''},400); }
  panel.style.animation='none'; void panel.offsetWidth; panel.style.animation='';
}
function coverSeed(inp){
  var seed=inp.value||'slowlog';
  var h=0x811c9dc5;
  for(var i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,0x01000193); }
  var v=Math.abs(h)%7;
  var pos=[[10,60],[60,20],[118,68],[92,38],[38,78],[136,52],[20,28]];
  var box=inp.closest('.pv,.m-pv'); if(!box) return;
  var dot=box.querySelector('.cov-dot'); if(dot){ dot.style.left=pos[v][0]+'px'; dot.style.top=pos[v][1]+'px'; }
  var lb=box.querySelector('.cov-no'); if(lb){ lb.textContent='DSN · No.'+v; }
}
if(!REDUCED) setInterval(function(){
  var t=(Date.now()%4000)/4000;
  var p=t<.5 ? .06+(.68-.06)*(t/.5) : .68-(.68-.06)*((t-.5)/.5);
  document.querySelectorAll('.prog-i').forEach(function(el){el.style.width=(p*100).toFixed(1)+'%'});
  document.querySelectorAll('.prog-t').forEach(function(el){el.textContent=Math.round(p*100)+'% · 预计 '+Math.max(1,Math.round(10-p*7))+' min'});
},60);
document.addEventListener('click',function(e){
  if(e.target.classList.contains('t3')){
    e.target.parentNode.querySelectorAll('.t3').forEach(function(x){x.classList.remove('sel')});
    e.target.classList.add('sel');
  }
  if(e.target.classList.contains('lg')){
    e.target.textContent = e.target.textContent.trim()==='EN' ? '中' : 'EN';
  }
});
render();
