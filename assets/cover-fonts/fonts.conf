<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  位图封面（/api/covers/[id]）专用 fontconfig 配置，由 lib/cover-fonts.ts 交给 librsvg。

  刻意「不 include 系统 fonts.conf」：Vercel 函数运行时不带任何系统字体，
  线上封面曾因此把每个 <text> 都光栅化成豆腐块（方框）。这里只认本目录下的
  三份 TTF，于是同一份 SVG 在本地与线上像素级一致 —— 缺不缺字体不再是环境问题。

  字体族名取自 TTF 内部 Family（不是文件名）：
    JetBrains Mono / Cormorant Garamond / Cormorant Garamond Light（斜体只有 Light 一档）
  Web 端不受此文件约束：浏览器里那套用 components/CoverArt.tsx 自行排版。
-->
<fontconfig>
  <!-- prefix="relative" 按「本文件所在目录」解析，避免依赖进程 cwd -->
  <dir prefix="relative">.</dir>
  <!-- 函数实例的根文件系统只读，/tmp 是唯一可写的缓存落点 -->
  <cachedir>/tmp/slowlog-fontconfig-cache</cachedir>
</fontconfig>
